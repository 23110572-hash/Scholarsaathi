services:
  - type: web
    name: scholarsaathi-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: python -m pip install -r requirements.txt
    preDeployCommand: alembic upgrade head
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips '*'
    healthCheckPath: /api/health/ready
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: APP_ENV
        value: production
      - key: APP_SECRET_KEY
        generateValue: true
      - key: SESSION_COOKIE_SECURE
        value: "true"
      - key: SESSION_TTL_HOURS
        value: "24"
      - key: CORS_ORIGINS
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: openai/gpt-oss-20b
      - key: GROQ_TIMEOUT_SECONDS
        value: "45"
      - key: GROQ_MAX_RETRIES
        value: "2"
      - key: LANGSMITH_TRACING
        value: "false"
