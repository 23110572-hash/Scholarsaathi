services:
  - type: web
    name: scholarsaathi
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: python -m pip install -r requirements.txt
    preDeployCommand: python -m alembic upgrade head
    startCommand: python -m uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health/ready
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: APP_ENV
        value: production
      - key: APP_SECRET_KEY
        generateValue: true
      - key: SESSION_COOKIE_SECURE
        value: "true"
      - key: SESSION_TTL_HOURS
        value: "24"
      - key: CORS_ORIGINS
        value: https://scholarsaathi-two.vercel.app
      - key: DATABASE_URL
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: openai/gpt-oss-20b
      - key: GROQ_TIMEOUT_SECONDS
        value: "45"
      - key: GROQ_MAX_RETRIES
        value: "2"
      # Groq free tier allows 8000 tokens per minute for openai/gpt-oss-20b and rejects
      # any single request whose prompt plus max_tokens exceeds it. Raise these together
      # after upgrading the Groq plan.
      - key: GROQ_TOKEN_BUDGET
        value: "8000"
      - key: GROQ_DISCOVERY_MAX_CANDIDATES
        value: "4"
      - key: GROQ_DISCOVERY_EVIDENCE_CHAR_LIMIT
        value: "900"
      - key: LANGSMITH_TRACING
        value: "false"
